[build]
builder = "NIXPACKS"
watchPatterns = ["/live_server.py", "/services/**", "/analysis/**", "/models.py", "/config.py", "/requirements.txt", "/railway.toml"]

[deploy]
startCommand = "sh -c 'MALLOC_ARENA_MAX=2 PYTHONMALLOC=malloc uvicorn live_server:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 16 --timeout-keep-alive 5'"
healthcheckPath = "/ready"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
WEB_CONCURRENCY = "1"
MALLOC_ARENA_MAX = "2"
DHAN_GATEWAY_CACHE_MAX_ENTRIES = "32"
# Persistent decision/replay journal is part of the production service. The attached
# Railway volume is mounted at /data; keeping these defaults in config-as-code avoids
# a silent journal disable after a fresh deployment/environment rebuild.
DAY_MEMORY_ENABLED = "1"
RAILWAY_VOLUME_MOUNT_PATH = "/data"
DAY_MEMORY_MIN_IDLE_SECONDS = "25"
DAY_MEMORY_SLIM = "1"

# Give Streamlit first priority after a deploy; background observers resume automatically.
DHAN_BACKGROUND_STARTUP_GRACE_SECONDS = "300"
